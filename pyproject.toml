[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heap-mapper"
version = "0.1.0"
description = "A prototype test data generator for C dynamic structures based on address mapping."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "AevaMeow" }
]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
heap-mapper = "heap_mapper.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
